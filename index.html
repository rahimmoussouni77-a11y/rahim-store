<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahim Store | الأزرق الملكي</title>
    <link id="faviconLink" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{
          --blue:#1e5fbf;
          --blue-light:#4a8fe7;
          --blue-dark:#0d3a7a;
          --blue-glow:#2a7fff;
          --black:#05080f;
          --black-2:#0a111f;
          --black-3:#101a2e;
          --gray:#7a8aa3;
          --border:#1a2942;
          --danger:#e74c3c;
          --success:#27ae60;
          --warning:#f39c12;
          --radius:16px;
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif;}
        body{
          background:var(--black);color:#eef3fb;line-height:1.7;min-height:100vh;
          background-image:
            radial-gradient(circle at 20% 10%, rgba(30,95,191,.12) 0%, transparent 45%),
            radial-gradient(circle at 80% 90%, rgba(42,127,255,.08) 0%, transparent 45%);
        }
        a{text-decoration:none;color:inherit;}
        img{max-width:100%;display:block;}

        header{background:rgba(5,8,15,.95);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);}
        .nav{max-width:1250px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
        .logo{display:flex;align-items:center;gap:12px;cursor:pointer;}
        .logo-img{width:48px;height:48px;object-fit:contain;border-radius:50%;border:2px solid var(--blue);padding:2px;background:var(--black-2);display:none;transition:.3s;box-shadow:0 0 20px rgba(42,127,255,.4);}
        .logo-img.show{display:block;}
        .logo-img:hover{transform:scale(1.08);}
        .logo-text{font-size:1.6rem;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,var(--blue-light),var(--blue),var(--blue-dark));-webkit-background-clip:text;background-clip:text;color:transparent;}
        .logo-text span{color:#fff;-webkit-text-fill-color:#fff;}
        .nav-links{display:flex;gap:24px;font-weight:600;color:#8fa3c4;font-size:.95rem;}
        .nav-links a:hover{color:var(--blue-light);}
        .nav-actions{display:flex;align-items:center;gap:8px;}
        .icon-btn{background:var(--black-3);border:1px solid var(--border);color:var(--blue-light);cursor:pointer;padding:8px 14px;border-radius:50px;font-weight:700;font-size:.85rem;transition:.25s;position:relative;}
        .icon-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
        .badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font-size:.65rem;padding:2px 6px;border-radius:50px;font-weight:800;}

        .hero{text-align:center;padding:80px 20px 70px;position:relative;overflow:hidden;}
        .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(42,127,255,.15) 0%, transparent 60%);pointer-events:none;}
        .hero-logo{width:130px;height:130px;object-fit:contain;margin:0 auto 22px;display:none;border-radius:50%;padding:8px;background:rgba(42,127,255,.08);border:2px solid var(--blue);box-shadow:0 0 50px rgba(42,127,255,.5);animation:heroGlow 3s ease-in-out infinite alternate;}
        .hero-logo.show{display:block;}
        @keyframes heroGlow{from{box-shadow:0 0 30px rgba(42,127,255,.3);}to{box-shadow:0 0 60px rgba(42,127,255,.7);}}
        .hero h1{font-size:3rem;font-weight:900;margin-bottom:16px;line-height:1.2;background:linear-gradient(135deg,#fff,var(--blue-light),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;}
        .hero p{font-size:1.15rem;color:#8fa3c4;max-width:600px;margin:auto;}
        .hero button{margin-top:32px;background:linear-gradient(135deg,var(--blue-light),var(--blue),var(--blue-dark));color:#fff;border:none;padding:16px 42px;border-radius:50px;font-size:1rem;font-weight:800;cursor:pointer;transition:.3s;box-shadow:0 8px 32px rgba(42,127,255,.4);letter-spacing:.5px;}
        .hero button:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(42,127,255,.6);}
        .blue-line{height:2px;width:80px;background:linear-gradient(90deg,transparent,var(--blue),transparent);margin:20px auto;}

        /* شريط الإعلانات */
        .marquee{background:linear-gradient(90deg,var(--blue-dark),var(--blue),var(--blue-dark));color:#fff;padding:10px 0;overflow:hidden;white-space:nowrap;font-weight:700;font-size:.9rem;}
        .marquee span{display:inline-block;padding-left:100%;animation:marquee 20s linear infinite;}
        @keyframes marquee{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}

        .section{max-width:1250px;margin:auto;padding:60px 22px;}
        .section-title{font-size:2rem;font-weight:900;margin-bottom:10px;text-align:center;background:linear-gradient(135deg,#fff,var(--blue-light));-webkit-background-clip:text;background-clip:text;color:transparent;}
        .section-sub{text-align:center;color:var(--gray);margin-bottom:44px;}

        /* فلاتر الفئات */
        .filters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:30px;}
        .filter-btn{background:var(--black-3);border:1px solid var(--border);color:var(--blue-light);padding:9px 20px;border-radius:50px;font-weight:700;cursor:pointer;font-size:.9rem;transition:.25s;}
        .filter-btn:hover{border-color:var(--blue);}
        .filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}

        /* البحث */
        .search-box{max-width:500px;margin:0 auto 30px;position:relative;}
        .search-box input{width:100%;padding:14px 48px 14px 20px;background:var(--black-2);color:#eef3fb;border:1px solid var(--border);border-radius:50px;font-size:1rem;outline:none;}
        .search-box input:focus{border-color:var(--blue);}
        .search-box::before{content:'🔍';position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:1.1rem;}

        .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px;}
        .card{background:linear-gradient(160deg,var(--black-2),var(--black-3));border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.35s;display:flex;flex-direction:column;position:relative;}
        .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--blue-light),transparent);opacity:0;transition:.35s;}
        .card:hover{transform:translateY(-8px);border-color:var(--blue);box-shadow:0 20px 50px rgba(42,127,255,.15);}
        .card:hover::before{opacity:1;}
        .card-img{height:230px;background:var(--black);display:grid;place-items:center;font-size:4rem;overflow:hidden;position:relative;}
        .card-img img{width:100%;height:100%;object-fit:cover;transition:.5s;}
        .card:hover .card-img img{transform:scale(1.08);}
        .card-body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1;}
        .card-title{font-weight:700;font-size:1.1rem;color:#eef3fb;}
        .card-category{font-size:.75rem;color:var(--gray);}
        .price-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
        .card-price{font-weight:900;font-size:1.35rem;background:linear-gradient(135deg,var(--blue-light),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;}
        .card-price small{color:var(--gray);font-weight:500;font-size:.8rem;-webkit-text-fill-color:var(--gray);}
        .old-price{color:var(--gray);text-decoration:line-through;font-size:.9rem;}
        .discount-tag{position:absolute;top:10px;left:10px;background:var(--danger);color:#fff;padding:4px 10px;border-radius:8px;font-weight:800;font-size:.75rem;z-index:2;}
        .featured-tag{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,var(--warning),#e67e22);color:#fff;padding:4px 10px;border-radius:8px;font-weight:800;font-size:.75rem;z-index:2;}
        .stock-warning{font-size:.75rem;color:var(--warning);font-weight:700;}
        .out-of-stock{position:absolute;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;color:var(--danger);font-weight:900;font-size:1.2rem;z-index:3;}
        .rating{font-size:.85rem;color:#f39c12;font-weight:700;}
        .add-btn{margin-top:auto;background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;border:none;padding:13px;border-radius:10px;font-weight:800;cursor:pointer;transition:.25s;font-size:.95rem;letter-spacing:.5px;}
        .add-btn:hover{background:linear-gradient(135deg,var(--blue-light),var(--blue));box-shadow:0 8px 24px rgba(42,127,255,.4);}
        .add-btn:disabled{opacity:.5;cursor:not-allowed;background:var(--gray);}
        .loading{text-align:center;padding:60px;color:var(--gray);grid-column:1/-1;font-size:1.1rem;}

        .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;z-index:200;backdrop-filter:blur(4px);}
        .overlay.open{display:block;}
        .panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.92);width:520px;max-width:94%;max-height:92vh;overflow-y:auto;background:linear-gradient(160deg,var(--black-2),var(--black));border:1px solid var(--blue-dark);border-radius:20px;z-index:201;padding:30px;display:none;opacity:0;transition:.3s;box-shadow:0 30px 80px rgba(0,0,0,.8),0 0 60px rgba(42,127,255,.1);}
        .panel.open{display:block;opacity:1;transform:translate(-50%,-50%) scale(1);}
        .panel h3{margin-bottom:20px;text-align:center;font-size:1.4rem;background:linear-gradient(135deg,#fff,var(--blue-light));-webkit-background-clip:text;background-clip:text;color:transparent;}
        .panel::-webkit-scrollbar{width:8px;}
        .panel::-webkit-scrollbar-track{background:var(--black);}
        .panel::-webkit-scrollbar-thumb{background:var(--blue-dark);border-radius:4px;}

        .field{margin-bottom:16px;}
        .field label{display:block;font-size:.85rem;font-weight:700;margin-bottom:7px;color:var(--blue-light);letter-spacing:.3px;}
        .field input,.field select,.field textarea{width:100%;padding:13px 15px;background:var(--black);color:#eef3fb;border:1px solid var(--border);border-radius:10px;font-size:.95rem;outline:none;font-family:inherit;transition:.25s;}
        .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(42,127,255,.15);}
        .field input::placeholder,.field textarea::placeholder{color:#4a5a75;}

        .cod-badge{background:linear-gradient(135deg,rgba(42,127,255,.15),rgba(42,127,255,.05));border:1px solid var(--blue-dark);color:var(--blue-light);padding:12px;border-radius:10px;font-weight:700;text-align:center;margin-bottom:16px;font-size:.9rem;}
        .order-summary{background:rgba(42,127,255,.05);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;font-size:.9rem;}
        .order-summary .row{display:flex;justify-content:space-between;margin-bottom:8px;color:#a8b8d0;}
        .order-summary .row.total{font-weight:900;color:var(--blue-light);font-size:1.05rem;border-top:1px dashed var(--border);padding-top:10px;margin-top:10px;}
        .order-summary .row.discount{color:var(--success);font-weight:700;}

        .coupon-box{display:flex;gap:8px;margin-bottom:12px;}
        .coupon-box input{flex:1;padding:11px;background:var(--black);color:#eef3fb;border:1px solid var(--border);border-radius:10px;font-size:.9rem;outline:none;font-family:inherit;}
        .coupon-box input:focus{border-color:var(--blue);}
        .coupon-box button{background:var(--blue);color:#fff;border:none;padding:11px 20px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.9rem;transition:.25s;}
        .coupon-box button:hover{background:var(--blue-light);}

        .submit-btn{width:100%;background:linear-gradient(135deg,var(--blue-light),var(--blue),var(--blue-dark));color:#fff;border:none;padding:15px;border-radius:12px;font-weight:900;cursor:pointer;font-size:1rem;letter-spacing:.5px;transition:.25s;}
        .submit-btn:hover{box-shadow:0 8px 28px rgba(42,127,255,.5);transform:translateY(-2px);}
        .submit-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

        .success-icon{font-size:5rem;margin-bottom:16px;text-align:center;filter:drop-shadow(0 0 30px rgba(42,127,255,.6));}
        .order-id{background:rgba(42,127,255,.1);border:1px dashed var(--blue);padding:14px;border-radius:12px;font-weight:900;color:var(--blue-light);margin:18px 0;font-size:1.2rem;letter-spacing:2px;text-align:center;}
        .success-panel p{color:var(--gray);text-align:center;margin-bottom:8px;}
        .success-panel .btn-row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
        .success-panel button{background:var(--black-3);color:var(--blue-light);border:1px solid var(--blue-dark);padding:12px 22px;border-radius:50px;font-weight:700;cursor:pointer;transition:.25s;font-size:.9rem;}
        .success-panel button:hover{background:var(--blue);color:#fff;}
        .success-panel button.wa{background:#25D366;color:#fff;border-color:#25D366;}
        .success-panel button.wa:hover{background:#1da851;}

        .track-box{max-width:580px;margin:auto;background:linear-gradient(160deg,var(--black-2),var(--black));border:1px solid var(--border);border-radius:var(--radius);padding:32px;}
        .track-box input{width:100%;padding:14px;background:var(--black);color:#eef3fb;border:1px solid var(--border);border-radius:10px;font-size:1rem;outline:none;margin-bottom:14px;}
        .track-box input:focus{border-color:var(--blue);}
        .track-box > button{width:100%;background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;border:none;padding:14px;border-radius:10px;font-weight:800;cursor:pointer;font-size:1rem;}
        .track-result{margin-top:22px;padding:20px;background:rgba(42,127,255,.05);border-radius:12px;display:none;border:1px solid var(--border);}
        .track-result.show{display:block;}
        .track-result .status{display:inline-block;background:rgba(39,174,96,.2);color:#2ecc71;padding:5px 16px;border-radius:50px;font-weight:700;font-size:.85rem;margin-bottom:14px;}
        .track-result .status.notfound{background:rgba(231,76,60,.2);color:#e74c3c;}
        .track-result .line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:.9rem;}
        .track-result .line:last-child{border:none;}

        .admin-tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1px solid var(--border);overflow-x:auto;}
        .admin-tab{padding:10px 20px;cursor:pointer;font-weight:700;color:var(--gray);border-bottom:2px solid transparent;transition:.25s;font-size:.9rem;white-space:nowrap;}
        .admin-tab.active{color:var(--blue-light);border-color:var(--blue);}
        .admin-tab:hover{color:var(--blue-light);}
        .admin-tab-content{display:none;}
        .admin-tab-content.active{display:block;}

        .admin-product{background:rgba(42,127,255,.03);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:.25s;}
        .admin-product:hover{border-color:var(--blue-dark);}
        .admin-product .pinfo{flex:1;display:flex;gap:12px;align-items:center;}
        .admin-product .pthumb{width:50px;height:50px;border-radius:8px;background:var(--black);overflow:hidden;display:grid;place-items:center;font-size:1.5rem;flex-shrink:0;}
        .admin-product .pthumb img{width:100%;height:100%;object-fit:cover;}
        .admin-product .pinfo h4{font-size:.95rem;color:#eef3fb;}
        .admin-product .pinfo span{color:var(--blue-light);font-weight:700;font-size:.85rem;}
        .admin-product .actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;}

        .btn-sm{padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:.78rem;transition:.2s;}
        .btn-edit{background:var(--blue);color:#fff;}
        .btn-edit:hover{background:var(--blue-light);}
        .btn-del{background:var(--danger);color:#fff;}
        .btn-del:hover{background:#c0392b;}
        .btn-feat{background:var(--warning);color:#fff;}
        .btn-feat:hover{background:#e67e22;}
        .btn-add{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;width:100%;padding:13px;border-radius:10px;font-weight:800;cursor:pointer;border:none;margin-bottom:16px;font-size:.95rem;}
        .btn-add:hover{background:linear-gradient(135deg,var(--blue-light),var(--blue));}

        .image-picker{border:2px dashed var(--blue-dark);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:.25s;background:rgba(42,127,255,.03);}
        .image-picker:hover{border-color:var(--blue);background:rgba(42,127,255,.08);}
        .image-picker input{display:none;}
        .image-preview{width:100%;height:180px;object-fit:cover;border-radius:10px;margin-top:12px;display:none;}
        .image-preview.show{display:block;}

        .logo-picker-preview{width:120px;height:120px;object-fit:contain;border-radius:50%;background:var(--black);border:2px solid var(--blue);padding:8px;margin:14px auto;display:none;}
        .logo-picker-preview.show{display:block;}

        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
        .stat-card{background:linear-gradient(160deg,var(--black-2),var(--black-3));border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center;}
        .stat-card .num{font-size:1.8rem;font-weight:900;color:var(--blue-light);}
        .stat-card .lbl{font-size:.8rem;color:var(--gray);margin-top:4px;}

        .toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,150%);background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;padding:14px 26px;border-radius:50px;font-weight:800;z-index:400;transition:.4s;box-shadow:0 12px 40px rgba(42,127,255,.5);max-width:90%;text-align:center;}
        .toast.show{transform:translate(-50%,0);}
        .toast.success{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;}
        .toast.error{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;}

        footer{background:var(--black-2);color:var(--gray);text-align:center;padding:36px 20px;margin-top:60px;border-top:1px solid var(--border);}
        .footer-logo{width:60px;height:60px;object-fit:contain;border-radius:50%;border:2px solid var(--blue);padding:4px;margin:0 auto 14px;background:var(--black);display:none;}
        .footer-logo.show{display:block;}
        footer strong{background:linear-gradient(135deg,var(--blue-light),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;}

        @media(max-width:700px){
          .nav-links{display:none;}
          .hero h1{font-size:2rem;}
          .hero p{font-size:1rem;}
          .section-title{font-size:1.5rem;}
          .panel{width:96%;padding:22px;}
          .admin-product{flex-wrap:wrap;}
          .logo-img{width:40px;height:40px;}
          .logo-text{font-size:1.3rem;}
        }
    </style>
</head>
<body>

<!-- شريط الإعلانات -->
<div class="marquee">
  <span>🚚 توصيل لجميع الولايات • 💵 الدفع عند الاستلام • 🎁 خصم 10% بكود WELCOME10 • ⭐ منتجات أصلية مضمونة</span>
</div>

<header>
    <div class="nav">
        <div class="logo" onclick="showHome()">
            <img id="headerLogo" class="logo-img" alt="Logo">
            <div class="logo-text">RAHIM <span>STORE</span></div>
        </div>
        <nav class="nav-links">
            <a href="#" onclick="showHome();return false;" data-i18n="nav_home"></a>
            <a href="#products" onclick="showHome();return false;" data-i18n="nav_products"></a>
            <a href="#" onclick="showTrack();return false;" data-i18n="nav_track"></a>
            <a href="#contact" onclick="showHome();return false;" data-i18n="nav_contact"></a>
        </nav>
        <div class="nav-actions">
            <button class="icon-btn" onclick="openWishlist()" title="المفضلة">❤️<span class="badge" id="wishlistBadge" style="display:none;">0</span></button>
            <button class="icon-btn" onclick="toggleLang()" id="langBtn">FR</button>
            <button class="icon-btn" onclick="openAdminLogin()" title="Admin">🔑</button>
        </div>
    </div>
</header>

<div id="homeView">
    <section class="hero">
        <img id="heroLogo" class="hero-logo" alt="Logo">
        <h1 data-i18n="hero_title"></h1>
        <div class="blue-line"></div>
        <p data-i18n="hero_sub"></p>
        <button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})" data-i18n="hero_btn"></button>
    </section>

    <section class="section" id="products">
        <h2 class="section-title" data-i18n="products_title"></h2>
        <div class="blue-line"></div>
        <p class="section-sub" data-i18n="products_sub"></p>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن منتج..." oninput="filterProducts()">
        </div>

        <div class="filters" id="filtersBox">
            <button class="filter-btn active" onclick="setCategory('all', this)">الكل</button>
        </div>

        <div class="products" id="productsGrid">
            <div class="loading" data-i18n="loading_products"></div>
        </div>
    </section>

    <section class="section" style="background:linear-gradient(160deg,var(--black-2),var(--black));border-radius:var(--radius);border:1px solid var(--border);">
        <h2 class="section-title" data-i18n="about_title"></h2>
        <div class="blue-line"></div>
        <p class="section-sub" style="max-width:700px;margin:auto;" data-i18n="about_text"></p>
    </section>

    <section class="section" id="contact">
        <h2 class="section-title" data-i18n="contact_title"></h2>
        <div class="blue-line"></div>

    let PRODUCTS = [];

    /* ================= اللوغو ================= */
    async function loadLogo(){
      try{
        const { data } = await sb.from("settings").select("value").eq("key", "logo_url").maybeSingle();
        const url = data && data.value ? data.value : "";
        applyLogo(url);
      }catch(e){ console.error("loadLogo error:", e); }
    }
    function applyLogo(url){
      currentLogoUrl = url || null;
      const imgs = ["headerLogo","heroLogo","footerLogo"].map(id => document.getElementById(id));
      if(url){
        imgs.forEach(img => { img.src = url; img.classList.add("show"); });
        const fav = document.getElementById("faviconLink");
        if(fav) fav.href = url;
      } else {
        imgs.forEach(img => { img.src = ""; img.classList.remove("show"); });
      }
    }
    function previewLogo(e){
      const file = e.target.files[0]; if(!file) return;
      pendingLogoFile = file;
      const reader = new FileReader();
      reader.onload = ev => {
        const preview = document.getElementById("logoPickerPreview");
        preview.src = ev.target.result; preview.classList.add("show");
      };
      reader.readAsDataURL(file);
    }
    async function saveLogo(){
      if(!pendingLogoFile){
        if(!currentLogoUrl){ showToast("⚠️ اختر صورة أولاً", "error"); return; }
        showToast(t("logo_saved"), "success"); return;
      }
      const btn = document.getElementById("logoSaveBtn");
      btn.disabled = true; btn.textContent = t("loading_upload");
      try{
        const url = await uploadImage(pendingLogoFile);
        await sb.from("settings").upsert({ key:"logo_url", value:url, updated_at:new Date().toISOString() });
        applyLogo(url);
        pendingLogoFile = null;
        document.getElementById("logoInput").value = "";
        showToast(t("logo_saved"), "success");
      }catch(e){ showToast(t("upload_failed"), "error"); }
      finally{ btn.disabled = false; btn.textContent = t("admin_save_logo"); }
    }
    async function removeLogo(){
      if(!confirm(t("admin_confirm_del"))) return;
      try{
        await sb.from("settings").upsert({ key:"logo_url", value:"", updated_at:new Date().toISOString() });
        applyLogo("");
        document.getElementById("logoPickerPreview").classList.remove("show");
        showToast(t("logo_removed"), "success");
      }catch(e){ showToast("❌ " + e.message, "error"); }
    }

    /* ================= المنتجات ================= */
    async function loadProducts(){
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = `<div class="loading">${t("loading_products")}</div>`;
      try{
        const { data, error } = await sb.from("products").select("*").eq("active", true).order("id", {ascending:false});
        if(error) throw error;
        PRODUCTS = data || [];
        renderFilters();
        renderProducts();
      }catch(err){
        grid.innerHTML = `<div class="loading" style="color:#e74c3c;">❌ ${err.message}</div>`;
      }
    }

    function renderFilters(){
      const box = document.getElementById("filtersBox");
      const cats = ["all", ...new Set(PRODUCTS.map(p => p.category || "عام"))];
      box.innerHTML = cats.map(c => 
        `<button class="filter-btn ${c === currentCategory ? 'active' : ''}" onclick="setCategory('${c}', this)">${c === 'all' ? 'الكل' : c}</button>`
      ).join("");
    }

    function setCategory(cat, el){
      currentCategory = cat;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      el.classList.add("active");
      renderProducts();
    }

    function filterProducts(){
      searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
      renderProducts();
    }

    function renderProducts(){
      const grid = document.getElementById("productsGrid");
      if(!grid) return;
      
      let filtered = PRODUCTS.filter(p => {
        const matchCat = currentCategory === "all" || p.category === currentCategory;
        const matchSearch = !searchQuery || p.name.toLowerCase().includes(searchQuery);
        return matchCat && matchSearch;
      });

      // المنتجات المميزة أولاً
      filtered.sort((a,b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));

      if(!filtered.length){
        grid.innerHTML = `<div class="loading">🛍️ ${t("admin_no_products")}</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const img = p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : (p.emoji || "📦");
        const hasDiscount = p.old_price && p.old_price > p.price;
        const discountPercent = hasDiscount ? Math.round((1 - p.price/p.old_price) * 100) : 0;
        const outOfStock = p.stock !== null && p.stock <= 0;
        const isWished = wishlist.includes(p.id);
        
        return `
        <div class="card">
          ${hasDiscount ? `<div class="discount-tag">-${discountPercent}%</div>` : ''}
          ${p.featured ? `<div class="featured-tag">⭐ مميز</div>` : ''}
          <div class="card-img">
            ${img}
            ${outOfStock ? `<div class="out-of-stock">${t("out_of_stock")}</div>` : ''}
          </div>
          <div class="card-body">
            <div class="card-category">📁 ${p.category || "عام"}</div>
            <div class="card-title">${p.name}</div>
            <div class="rating">⭐ ${Number(p.rating || 5).toFixed(1)} ${p.sold > 0 ? `• بيع ${p.sold}` : ''}</div>
            <div class="price-row">

    /* ================= كوبونات الخصم ================= */
    async function applyCoupon(){
      const code = document.getElementById("couponInput").value.trim().toUpperCase();
      if(!code){ showToast("⚠️ أدخل الكود", "error"); return; }
      try{
        const { data } = await sb.from("coupons").select("*").eq("code", code).eq("active", true).maybeSingle();
        if(!data){ showToast("❌ كود غير صالح", "error"); appliedCoupon = null; renderOrderSummary(); return; }
        if(data.expires_at && new Date(data.expires_at) < new Date()){ showToast("❌ انتهت صلاحية الكود", "error"); appliedCoupon = null; renderOrderSummary(); return; }
        if(data.uses >= data.max_uses){ showToast("❌ استُنفد الكود", "error"); appliedCoupon = null; renderOrderSummary(); return; }
        appliedCoupon = data;
        showToast(`✅ تم تطبيق خصم ${data.discount_percent}%`, "success");
        renderOrderSummary();
      }catch(e){ showToast("❌ خطأ في الكود", "error"); }
    }

    /* ================= ملخص الطلب ================= */
    function calcTotals(){
      if(!currentProduct) return { subtotal:0, shipping:0, total:0, discount:0 };
      const qty = Number(document.getElementById("cQty").value) || 1;
      const subtotal = currentProduct.price * qty;
      let discount = 0;
      if(appliedCoupon && subtotal >= (appliedCoupon.min_order || 0)){
        discount = Math.round(subtotal * appliedCoupon.discount_percent / 100);
      }
      const afterDiscount = subtotal - discount;
      const shipping = afterDiscount >= 10000 ? 0 : 500;
      return { subtotal, discount, shipping, total: afterDiscount + shipping, qty };
    }
    function renderOrderSummary(){
      if(!currentProduct) return;
      const { subtotal, discount, shipping, total, qty } = calcTotals();
      document.getElementById("orderSummary").innerHTML = `
        <div class="row"><span>${currentProduct.name} × ${qty}</span><span>${subtotal.toLocaleString()} DZD</span></div>
        ${discount > 0 ? `<div class="row discount"><span>🎁 خصم (${appliedCoupon.code})</span><span>-${discount.toLocaleString()} DZD</span></div>` : ''}
        <div class="row"><span>${t("shipping_label")}</span><span>${shipping === 0 ? t("shipping_free") : shipping + " DZD"}</span></div>
        <div class="row total"><span>${t("total_label")}</span><span>${total.toLocaleString()} DZD</span></div>
      `;
    }

    /* ================= إرسال الطلب ================= */
    async function submitOrder(e){
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true; btn.textContent = "⏳...";

      const name = document.getElementById("cName").value.trim();
      const phone = document.getElementById("cPhone").value.trim();
      const wilaya = document.getElementById("cWilaya").value;
      const commune = document.getElementById("cCommune").value;
      const address = document.getElementById("cAddress").value.trim();
      const qty = Number(document.getElementById("cQty").value) || 1;

      if(!wilaya || !commune){
        showToast(t("willaya_required"), "error");
        btn.disabled = false; btn.textContent = t("submit_order");
        return;
      }

      const { subtotal, discount, shipping, total } = calcTotals();
      const orderId = "RS-" + Date.now().toString().slice(-6);

      const order = {
        id: orderId,
        customer: { name, phone, wilaya, commune, address },
        product: { id: currentProduct.id, name: currentProduct.name, price: currentProduct.price, qty },
        subtotal, discount, shipping, total,
        coupon_code: appliedCoupon ? appliedCoupon.code : null,
        status: "قيد المراجعة",
        date: new Date().toLocaleString("ar-DZ")
      };

      try{
        await sb.from("orders").insert({
          id: orderId, customer_name: name, customer_phone: phone,
          wilaya, commune, address,
          payment_method: "COD",
          items: [order.product],
          subtotal, discount, shipping, total,
          coupon_code: order.coupon_code,
          status: "قيد المراجعة"
        });

        // تحديث عداد الكوبون
        if(appliedCoupon){
          await sb.from("coupons").update({ uses: (appliedCoupon.uses || 0) + 1 }).eq("code", appliedCoupon.code);
        }

        // تحديث مبيعات ومخزون المنتج
        const newSold = (currentProduct.sold || 0) + qty;
        const newStock = currentProduct.stock !== null ? currentProduct.stock - qty : null;
        await sb.from("products").update({ sold: newSold, stock: newStock }).eq("id", currentProduct.id);
      }catch(err){ console.error(err); }

      const orders = JSON.parse(localStorage.getItem("rahim_orders") || "[]");
      orders.push(order);
      localStorage.setItem("rahim_orders", JSON.stringify(orders));

      lastOrder = order;
      sendToWhatsApp(order);

      closeAll();
      document.getElementById("successOrderId").textContent = orderId;
      document.getElementById("overlay").classList.add("open");
      document.getElementById("successPanel").classList.add("open");

      document.getElementById("orderForm").reset();
      document.getElementById("communeField").style.display = "none";
      btn.disabled = false; btn.textContent = t("submit_order");
      appliedCoupon = null;
    }

    /* ================= واتساب ================= */
    function buildWhatsAppMessage(order){
      const p = order.product;
      let msg = `🛒 *طلب جديد — RAHIM STORE*\n━━━━━━━━━━━━━━━\n`;
      msg += `🔖 ${order.id}\n👤 ${order.customer.name}\n📞 ${order.customer.phone}\n`;
      msg += `📍 ${order.customer.wilaya} - ${order.customer.commune}\n🏠 ${order.customer.address}\n💳 COD\n`;
      msg += `━━━━━━━━━━━━━━━\n📦 ${p.name} × ${p.qty} = ${(p.price*p.qty).toLocaleString()} DZD\n`;
      if(order.discount > 0) msg += `🎁 خصم ${order.coupon_code}: -${order.discount.toLocaleString()} DZD\n`;
      msg += `━━━━━━━━━━━━━━━\n💰 *${order.total.toLocaleString()} DZD*\n🕒 ${order.date}`;
      return msg;
    }
    function sendToWhatsApp(order){

    function previewImage(e){
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const preview = document.getElementById("pImagePreview");
        preview.src = ev.target.result; preview.classList.add("show");
      };
      reader.readAsDataURL(file);
    }
    async function uploadImage(file){
      const ext = file.name.split(".").pop();
      const fileName = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error } = await sb.storage.from(STORAGE_BUCKET).upload(fileName, file, { cacheControl: "3600", upsert: false });
      if(error) throw error;
      const { data: urlData } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(fileName);
      return urlData.publicUrl;
    }
    async function saveProduct(){
      const name = document.getElementById("pName").value.trim();
      const desc = document.getElementById("pDesc").value.trim();
      const price = Number(document.getElementById("pPrice").value);
      const oldPrice = Number(document.getElementById("pOldPrice").value) || null;
      const category = document.getElementById("pCategory").value;
      const stock = Number(document.getElementById("pStock").value) || 0;
      const featured = document.getElementById("pFeatured").value === "true";
      const file = document.getElementById("pImageInput").files[0];
      
      if(!name || !price){ showToast("⚠️ الاسم والسعر مطلوبان", "error"); return; }
      
      const btn = document.getElementById("pSaveBtn");
      btn.disabled = true;
      try{
        let imageUrl = uploadedImageUrl;
        if(file){ btn.textContent = t("loading_upload"); imageUrl = await uploadImage(file); }
        
        const discountPercent = oldPrice && oldPrice > price ? Math.round((1 - price/oldPrice) * 100) : 0;
        const payload = { 
          name, description: desc, price, old_price: oldPrice, discount_percent: discountPercent,
          image_url: imageUrl, category, stock, featured, active: true 
        };
        
        if(editingProductId){
          const { error } = await sb.from("products").update(payload).eq("id", editingProductId);
          if(error) throw error;
          showToast(t("product_updated"), "success");
        } else {
          const { error } = await sb.from("products").insert(payload);
          if(error) throw error;
          showToast(t("product_added"), "success");
        }
        hideProductForm();
        await loadAdminData();
      }catch(e){ showToast(t("upload_failed") + " " + e.message, "error"); }
      finally{ btn.disabled = false; btn.textContent = t("admin_save"); }
    }
    async function deleteProduct(id){
      if(!confirm(t("admin_confirm_del"))) return;
      try{
        await sb.from("products").delete().eq("id", id);
        showToast(t("product_deleted"), "success");
        await loadAdminData();
      }catch(e){ showToast("❌ " + e.message, "error"); }
    }
    async function toggleFeatured(id){
      const p = PRODUCTS.find(x => x.id === id);
      await sb.from("products").update({ featured: !p.featured }).eq("id", id);
      showToast(p.featured ? "تم إلغاء التمييز" : "⭐ تم التمييز", "success");
      await loadAdminData();
    }
    async function updateOrderStatus(id, status){
      try{
        await sb.from("orders").update({ status }).eq("id", id);
        showToast("✅ " + status, "success");
        renderStats();
      }catch(e){ showToast("❌ " + e.message, "error"); }
    }

    /* ================= فتح/إغلاق ================= */
    function closeAll(){
      document.getElementById("overlay").classList.remove("open");
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("open"));
    }

    /* ================= Toast ================= */
    let toastTimer;
    function showToast(msg, type){
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = "toast show" + (type ? " " + type : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
    }

    /* ================= تشغيل ================= */
    applyLang();
    fillWilayas();
    loadLogo();
    loadProducts();
    updateWishlistBadge();
</script>
</body>
</html>
